<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Retro arcade card background -->
  <rect width="32" height="32" rx="6" fill="#120a21"/>
  <rect x="1" y="1" width="30" height="30" rx="5" fill="#1f1730" stroke="#5a3696" stroke-width="2"/>
  
  <!-- Pixel Gamepad Body -->
  <rect x="5" y="10" width="22" height="13" fill="#f6c833"/>
  <rect x="7" y="8" width="18" height="17" fill="#f6c833"/>
  
  <!-- 3D shadow on bottom of controller -->
  <rect x="5" y="19" width="22" height="4" fill="#c99709"/>
  <rect x="7" y="21" width="18" height="4" fill="#c99709"/>
  
  <!-- Top triggers / shoulder buttons -->
  <rect x="7" y="6" width="5" height="2" fill="#c99709"/>
  <rect x="20" y="6" width="5" height="2" fill="#c99709"/>

  <!-- Screen / Mini Display in Center -->
  <rect x="13" y="10" width="6" height="6" fill="#120a21"/>
  <!-- Glowing Pixel Heart inside screen -->
  <rect x="14" y="11" width="4" height="2" fill="#d93876"/>
  <rect x="15" y="13" width="2" height="2" fill="#ff70a6"/>
  <rect x="14" y="11" width="1" height="1" fill="#fff"/>

  <!-- D-Pad (Left side) -->
  <rect x="8" y="12" width="3" height="7" fill="#120a21"/>
  <rect x="6" y="14" width="7" height="3" fill="#120a21"/>
  <rect x="9" y="13" width="1" height="5" fill="#45b7d1"/>
  <rect x="7" y="15" width="5" height="1" fill="#45b7d1"/>
  
  <!-- Action Buttons (Right side) -->
  <rect x="21" y="12" width="3" height="3" fill="#d93876"/>
  <rect x="21" y="12" width="1" height="1" fill="#ffb4cd"/>
  
  <rect x="19" y="16" width="3" height="3" fill="#26c281"/>
  <rect x="19" y="16" width="1" height="1" fill="#8ef0c4"/>

  <rect x="23" y="16" width="3" height="3" fill="#ff89bb"/>
  
  <!-- Little arcade sparkles -->
  <rect x="3" y="3" width="2" height="2" fill="#ffd166"/>
  <rect x="27" y="3" width="2" height="2" fill="#26c281"/>
</svg>
